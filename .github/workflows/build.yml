name: Build Desktop App (Windows)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows 11 / 10 (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Tailwind CSS
        run: npx @tailwindcss/cli -i ./tailwind.css -o ./assets/tailwind.css

      - name: Install Dioxus CLI (dx)
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli

      - name: Build & Bundle Desktop App with Dioxus
        run: dx bundle --platform windows --release

      # -------------------------------------------------------------
      # Packaging for Windows 11/10 (.zip)
      # -------------------------------------------------------------
      - name: Package Windows App (.zip)
        shell: bash
        run: |
          mkdir -p dist/WHassistant-Windows-x64
          
          # Find and copy built binary
          EXE_PATH=$(find target -name "w-hassistant.exe" -o -name "WHassistant.exe" | head -n 1)
          echo "Found Windows executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/WHassistant-Windows-x64/WHassistant.exe
          
          # Copy assets alongside executable
          cp -r assets dist/WHassistant-Windows-x64/
          
          # Check for any .msi or installer produced by dx bundle
          MSI_PATH=$(find target -name "*.msi" | head -n 1)
          if [ -n "$MSI_PATH" ]; then
            echo "Found MSI installer at: $MSI_PATH"
            cp "$MSI_PATH" dist/
          fi

          # Create zip archive
          cd dist
          7z a -tzip WHassistant-Windows-x64.zip WHassistant-Windows-x64/
          cd ..

          ls -lh dist/

      # -------------------------------------------------------------
      # Upload Artifacts (Available in GitHub Actions Run)
      # -------------------------------------------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WHassistant-Windows-x64
          path: dist/*
          if-no-files-found: error

      # -------------------------------------------------------------
      # Create GitHub Release (Triggered on git tag push: v*)
      # -------------------------------------------------------------
      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
