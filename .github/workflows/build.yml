name: Build Desktop App

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-AppleSilicon
            os: macos-14
            target: aarch64-apple-darwin
            artifact_name: WHassistant-macOS-arm64
            bundle_cmd: dx bundle --platform macos --release
            platform_type: macos

          - name: macOS-Intel
            os: macos-13
            target: x86_64-apple-darwin
            artifact_name: WHassistant-macOS-x64
            bundle_cmd: dx bundle --platform macos --release
            platform_type: macos

          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: WHassistant-Windows-x64
            bundle_cmd: dx bundle --platform windows --release
            platform_type: windows

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Tailwind CSS
        run: npx @tailwindcss/cli -i ./tailwind.css -o ./assets/tailwind.css

      - name: Install Dioxus CLI (dx)
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli

      - name: Build & Bundle Desktop App with Dioxus
        run: ${{ matrix.platform.bundle_cmd }}

      # -------------------------------------------------------------
      # Packaging for macOS (.dmg and .zip)
      # -------------------------------------------------------------
      - name: Package macOS App (.dmg and .zip)
        if: matrix.platform.platform_type == 'macos'
        run: |
          mkdir -p dist
          APP_PATH=$(find target/dx -name "WHassistant.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find target -name "*.app" -type d | head -n 1)
          fi
          echo "Found macOS App at: $APP_PATH"

          ARCH_LABEL="${{ matrix.platform.artifact_name }}"
          DMG_NAME="${ARCH_LABEL}.dmg"
          ZIP_NAME="${ARCH_LABEL}.zip"

          # 1. Create .dmg installer disk image
          hdiutil create -volname "WHassistant" -srcfolder "$APP_PATH" -ov -format UDZO "dist/${DMG_NAME}"

          # 2. Create .zip archive preserving Mac metadata and symlinks
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/${ZIP_NAME}"

          ls -lh dist/

      # -------------------------------------------------------------
      # Packaging for Windows 11/10 (.zip)
      # -------------------------------------------------------------
      - name: Package Windows App (.zip)
        if: matrix.platform.platform_type == 'windows'
        shell: bash
        run: |
          mkdir -p dist/WHassistant-Windows-x64
          
          # Find and copy built binary
          EXE_PATH=$(find target -name "w-hassistant.exe" -o -name "WHassistant.exe" | head -n 1)
          echo "Found Windows executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/WHassistant-Windows-x64/WHassistant.exe
          
          # Copy assets alongside executable
          cp -r assets dist/WHassistant-Windows-x64/
          
          # Check for any .msi or installer produced by dx bundle
          MSI_PATH=$(find target -name "*.msi" | head -n 1)
          if [ -n "$MSI_PATH" ]; then
            echo "Found MSI installer at: $MSI_PATH"
            cp "$MSI_PATH" dist/
          fi

          # Create zip archive
          cd dist
          7z a -tzip WHassistant-Windows-x64.zip WHassistant-Windows-x64/
          cd ..

          ls -lh dist/

      # -------------------------------------------------------------
      # Upload Artifacts (Available in GitHub Actions Run)
      # -------------------------------------------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: dist/*
          if-no-files-found: error

      # -------------------------------------------------------------
      # Create GitHub Release (Triggered on git tag push: v*)
      # -------------------------------------------------------------
      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
