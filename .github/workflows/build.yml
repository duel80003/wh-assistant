name: Build Desktop App (Windows)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows 11 / 10 (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "windows-x86_64-msvc"
          cache-on-failure: true

      - name: Configure compiler cache environment
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile Tailwind CSS
        run: npx --yes @tailwindcss/cli -i ./tailwind.css -o ./assets/tailwind.css

      - name: Sync Cargo.toml version with Git Tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "Detected Git Tag: $GITHUB_REF_NAME, updating Cargo.toml version to $TAG_VER"
            sed -i.bak -E '0,/^version = ".*"/s/^version = ".*"/version = "'"$TAG_VER"'"/' Cargo.toml
            rm -f Cargo.toml.bak
            echo "--- Updated Cargo.toml ---"
            head -n 6 Cargo.toml
          fi

      - name: Add WiX Toolset to PATH
        shell: bash
        run: |
          if [ -d "/c/Program Files (x86)/WiX Toolset v3.11/bin" ]; then
            echo "Adding WiX Toolset to PATH"
            echo "/c/Program Files (x86)/WiX Toolset v3.11/bin" >> $GITHUB_PATH
          fi

      - name: Install Dioxus CLI (dx)
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli

      - name: Build & Bundle Desktop App with Dioxus
        shell: bash
        run: |
          dx bundle --desktop --package-types msi --release || dx bundle --platform windows --release || dx build --desktop --release

      # -------------------------------------------------------------
      # Packaging for Windows 11/10 (.zip)
      # -------------------------------------------------------------
      - name: Package Windows App (.zip)
        shell: bash
        run: |
          mkdir -p dist/WHassistant-Windows-x64/assets

          # Find and copy built binary (prefer binary in target/dx if present)
          EXE_PATH=$(find target -type f \( -name "WHassistant.exe" -o -name "wh-assistant.exe" -o -name "w-hassistant.exe" \) | grep -E "windows|release" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            EXE_PATH=$(find target -type f -name "*.exe" | grep -v "build" | head -n 1)
          fi
          echo "Found Windows executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/WHassistant-Windows-x64/WHassistant.exe

          # 1. Copy source assets
          cp -r assets/* dist/WHassistant-Windows-x64/assets/

          # 2. Copy compiled/hashed assets produced by Dioxus Manganis
          find target -type d -name "assets" | while read -r asset_dir; do
            echo "Copying compiled assets from: $asset_dir"
            cp -r "$asset_dir"/* dist/WHassistant-Windows-x64/assets/ 2>/dev/null || true
          done

          echo "--- Dist Directory Contents ---"
          ls -la dist/WHassistant-Windows-x64/
          echo "--- Assets Directory Contents ---"
          ls -la dist/WHassistant-Windows-x64/assets/

          # Check for any .msi or installer produced by dx bundle
          find target -type f -name "*.msi" | while read -r msi_file; do
            echo "Found MSI installer at: $msi_file"
            cp "$msi_file" dist/
          done

          # Create zip archive
          cd dist
          7z a -tzip WHassistant-Windows-x64.zip WHassistant-Windows-x64/
          cd ..

          ls -lh dist/

      # -------------------------------------------------------------
      # Upload Artifacts (Available in GitHub Actions Run)
      # -------------------------------------------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WHassistant-Windows-x64
          path: dist/*
          if-no-files-found: error

      # -------------------------------------------------------------
      # Create GitHub Release (Triggered on git tag push: v*)
      # -------------------------------------------------------------
      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
